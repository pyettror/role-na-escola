<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Rolê na Escola | Em manutenção</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef5ff,#f8fafc 55%,#e8f1ff);font-family:Arial,Helvetica,sans-serif;color:#183153}
    main{width:min(100%,680px);text-align:center;background:#fff;padding:clamp(32px,7vw,64px) clamp(24px,6vw,56px);border:1px solid #e4ebf5;border-radius:28px;box-shadow:0 20px 60px rgba(29,63,105,.10)}
    .symbol{width:76px;height:76px;margin:0 auto 24px;border-radius:24px;display:grid;place-items:center;background:#e8f1ff;color:#2563a6;font-size:36px}
    .tag{display:inline-block;margin-bottom:16px;padding:8px 14px;border-radius:99px;background:#edf4ff;color:#28609b;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
    h1{margin:0 0 16px;font-size:clamp(30px,6vw,46px);line-height:1.1;letter-spacing:-1.2px}
    p{margin:0 auto;color:#5b6d82;font-size:17px;line-height:1.7;max-width:490px}
    .foot{margin-top:34px;padding-top:22px;border-top:1px solid #edf1f6;color:#8a98a9;font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">✦</div>
    <div class="tag">Estamos em manutenção</div>
    <h1>O Rolê na Escola está de cara nova!</h1>
    <p>Estamos trabalhando em uma nova versão do site para trazer uma experiência melhor. Em breve, estaremos de volta com novidades!</p>
    <div class="foot">Rolê na Escola · Colégio de Tempo Integral Filomena Pereira Rodrigues</div>
  </main>
</body>
</html>
